components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key, description: "Required only when the server sets API_KEYS (Authorization: Bearer is also accepted)."}
    labelsToken: {type: http, scheme: bearer, description: "LABELS_TOKEN, for label writes."}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        request_id: {type: string}
    Health:
      type: object
      properties: {status: {type: string, enum: [ok, down]}, reason: {type: string}}
    Ready:
      type: object
      properties:
        status: {type: string, enum: [ready, not ready]}
        reason: {type: string}
        last_closed_at: {type: [string, "null"], format: date-time}
        lag_seconds: {type: integer}
        max_lag_seconds: {type: integer}
    Component:
      type: object
      description: Pipeline heartbeat (fetcher, writer).
      properties:
        name: {type: string}
        role: {type: string}
        ledger: {type: [integer, "null"]}
        tip: {type: [integer, "null"]}
        info: {type: object}
        updated_at: {type: string, format: date-time}
    Gap:
      type: object
      properties:
        from_ledger: {type: integer}
        to_ledger: {type: integer}
        reason: {type: string}
        detected_at: {type: string, format: date-time}
    Status:
      type: object
      properties:
        network: {type: string}
        cursor: {type: [integer, "null"], description: Last fully indexed ledger.}
        updated_at: {type: [string, "null"], format: date-time}
        first_ledger: {type: [integer, "null"]}
        last_closed_at: {type: [string, "null"], format: date-time}
        ledgers_indexed: {type: integer}
        components: {type: array, items: {$ref: "#/components/schemas/Component"}}
        gaps: {type: integer, description: Ledger ranges never received.}
        last_gap: {oneOf: [{$ref: "#/components/schemas/Gap"}, {type: "null"}]}
        rpc_tip: {type: [integer, "null"], description: Highest tip reported by a component.}
        lag_ledgers: {type: [integer, "null"]}
        lag_seconds: {type: [integer, "null"], description: Wall-clock seconds since the newest indexed ledger closed.}
    SearchHit:
      type: object
      properties:
        kind: {type: string, enum: [ledger, transaction, pool, account, contract, asset, tag]}
        id: {type: string}
        label: {type: string}
    Ledger:
