openapi: 3.1.0
info:
  title: stellar-indexer API
  version: 1.0.0
  description: >-
    Read API over a Stellar analytics index (ledgers, transactions, operations, token flows, trades and
    candles, Soroban protocol events, portfolios, tags) plus user labels. Analytics windows end at the
    newest indexed ledger, not the wall clock. Only verified fills (classic venues and Soroban pools whose
    code is allowlisted) feed prices, candles and analytics. Amount strings are integers in 7-decimal base
    units; *_xlm and *_volume fields are whole units. When API keys are configured, send X-API-Key.
servers:
  - url: /
security:
  - {}
  - apiKey: []
tags:
  - name: status
  - name: explorer
  - name: accounts
  - name: markets
  - name: protocols
  - name: stats
  - name: labels
  - name: insights
paths:
  /:
    get:
      tags: [status]
      summary: Service index
      operationId: get_
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"type":"object","description":"Service name, network, feature flags and the endpoint list."}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /health:
    get:
      tags: [status]
      summary: Liveness probe
      operationId: get_health
      description: "200 when the process serves and Postgres answers; 503 otherwise. Exempt from API keys and rate limits."
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"$ref":"#/components/schemas/Health"}}}
        '503':
          description: Unavailable
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /ready:
    get:
      tags: [status]
      summary: Readiness probe
      operationId: get_ready
      description: "503 when Postgres is down or, with READY_MAX_LAG set, the newest indexed ledger is older than the limit."
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"$ref":"#/components/schemas/Ready"}}}
        '503':
          description: Unavailable
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /metrics:
    get:
      tags: [status]
      summary: Prometheus metrics
      operationId: get_metrics
      description: "Prometheus text exposition (indexer_*, http_*, go_*, process_*). Exempt from API keys."
      responses:
        '200':
          description: OK
          content: {text/plain: {schema: {type: string}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /openapi.yaml:
    get:
      tags: [status]
      summary: This specification
      operationId: get_openapi_yaml
      responses:
        '200':
          description: OK
          content: {application/yaml: {schema: {type: string}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /status:
    get:
      tags: [status]
      summary: Index position and pipeline health
      operationId: get_status
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"$ref":"#/components/schemas/Status"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /search:
    get:
      tags: [status]
      summary: Classify a search term
      operationId: get_search
      parameters:
        - name: q
          in: query
          required: true
          description: "Ledger number, 64-hex tx hash, G…/C… address, asset code or #tag."
          schema: {"type":"string"}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"type":"array","items":{"$ref":"#/components/schemas/SearchHit"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /ledgers:
    get:
      tags: [explorer]
      summary: Ledgers, newest first
      operationId: get_ledgers
      parameters:
        - name: before
          in: query
          required: false
          description: "Keyset cursor: the last row's id (TOID; ledgers: sequence)."
          schema: {"type":"string","pattern":"^[0-9]+$"}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/Ledger"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /ledgers/{seq}:
    get:
      tags: [explorer]
      summary: One ledger with its transactions
      operationId: get_ledgers_by_seq
      parameters:
        - name: seq
          in: path
          required: true
          description: "Ledger sequence."
          schema: {"type":"integer","format":"int64"}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"$ref":"#/components/schemas/Ledger"}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '404':
          description: Not found
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /transactions:
    get:
      tags: [explorer]
      summary: Filtered transaction feed
      operationId: get_transactions
      parameters:
        - name: before
          in: query
          required: false
          description: "Keyset cursor: the last row's id (TOID; ledgers: sequence)."
          schema: {"type":"string","pattern":"^[0-9]+$"}
        - name: source
          in: query
          required: false
          description: "Source account."
          schema: {"type":"string"}
        - name: contract
          in: query
          required: false
          description: "Contract id (C…)."
          schema: {"type":"string"}
        - name: function
          in: query
          required: false
          description: "Invoked function."
          schema: {"type":"string"}
        - name: successful
          in: query
          required: false
          description: "Filter by outcome."
          schema: {"type":"boolean"}
        - name: soroban
          in: query
          required: false
          description: "Soroban (true) or classic (false)."
          schema: {"type":"boolean"}
        - name: ledger
          in: query
          required: false
          description: "Exact ledger."
          schema: {"type":"integer","format":"int64"}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/TransactionSummary"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /transactions/{hash}:
    get:
      tags: [explorer]
      summary: Transaction with operations, transfers, trades and events
      operationId: get_transactions_by_hash
      parameters:
        - name: hash
          in: path
          required: true
          description: "Transaction hash."
          schema: {"type":"string","pattern":"^[0-9a-fA-F]{64}$"}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"$ref":"#/components/schemas/TransactionDetail"}}}
        '404':
          description: Not found
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /operations:
    get:
      tags: [explorer]
      summary: Typed operation feed
      operationId: get_operations
      parameters:
        - name: before
          in: query
          required: false
          description: "Keyset cursor: the last row's id (TOID; ledgers: sequence)."
          schema: {"type":"string","pattern":"^[0-9]+$"}
        - name: type
          in: query
          required: false
          description: "Operation type, e.g. invoke_host_function."
          schema: {"type":"string"}
        - name: source
          in: query
          required: false
          description: "Source account."
          schema: {"type":"string"}
        - name: successful
          in: query
          required: false
          description: "Filter by outcome."
          schema: {"type":"boolean"}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/Operation"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /transfers:
    get:
      tags: [explorer]
      summary: Token-flow feed (CAP-67)
      operationId: get_transfers
      parameters:
        - name: before
          in: query
          required: false
          description: "Keyset cursor ledger.tx_index.transfer_index."
          schema: {"type":"string","pattern":"^[0-9]+\\.[0-9]+\\.[0-9]+$"}
        - name: asset
          in: query
          required: false
          description: "Asset key: native/XLM, CODE:ISSUER or C… contract."
          schema: {"type":"string"}
        - name: type
          in: query
          required: false
          description: "Transfer type."
          schema: {"type":"string","enum":["transfer","mint","burn","clawback","fee"]}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/Transfer"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /events:
    get:
      tags: [explorer]
      summary: Contract event feed
      operationId: get_events
      parameters:
        - name: before
          in: query
          required: false
          description: "Keyset cursor ledger.tx_index.op_index.event_index."
          schema: {"type":"string","pattern":"^[0-9]+(\\.[0-9]+){3}$"}
        - name: contract
          in: query
          required: false
          description: "Contract id (C…)."
          schema: {"type":"string"}
        - name: topic
          in: query
          required: false
          description: "First topic (topic0)."
          schema: {"type":"string"}
        - name: protocol
          in: query
          required: false
          description: "Decoded protocol, or `none` for contracts without a decoder."
          schema: {"type":"string"}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/ContractEvent"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /contracts:
    get:
      tags: [explorer]
      summary: Most active contracts
      operationId: get_contracts
      description: "Cached (CACHE_TTL)."
      parameters:
        - name: hours
          in: query
          required: false
          description: "Window length, ending at the newest indexed ledger."
          schema: {"type":"integer","minimum":1,"maximum":2160,"default":24}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/ContractActivity"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /contracts/{id}:
    get:
      tags: [explorer]
      summary: Contract summary, executable and verification
      operationId: get_contracts_by_id
      parameters:
        - name: id
          in: path
          required: true
          description: "Contract id."
          schema: {"type":"string","pattern":"^C[A-Z2-7]{55}$"}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"$ref":"#/components/schemas/ContractSummary"}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /contracts/{id}/events:
    get:
      tags: [explorer]
      summary: Events of one contract
      operationId: get_contracts_by_id_events
      parameters:
        - name: id
          in: path
          required: true
          description: "Contract id."
          schema: {"type":"string","pattern":"^C[A-Z2-7]{55}$"}
        - name: before
          in: query
          required: false
          description: "Keyset cursor ledger.tx_index.op_index.event_index."
          schema: {"type":"string","pattern":"^[0-9]+(\\.[0-9]+){3}$"}
        - name: topic
          in: query
          required: false
          description: "First topic (topic0)."
          schema: {"type":"string"}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/ContractEvent"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /accounts/top:
    get:
      tags: [accounts]
      summary: Largest indexed XLM balances
      operationId: get_accounts_top
      parameters:
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/AccountRank"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /accounts/{id}:
    get:
      tags: [accounts]
      summary: Account state, trustlines, offers and 24h activity
      operationId: get_accounts_by_id
      parameters:
        - name: id
          in: path
          required: true
          description: "Account (G…/M…) or contract (C…) address."
          schema: {"type":"string"}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"$ref":"#/components/schemas/Account"}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /accounts/{id}/operations:
    get:
      tags: [accounts]
      summary: Operations sourced by the address
      operationId: get_accounts_by_id_operations
      parameters:
        - name: id
          in: path
          required: true
          description: "Account (G…/M…) or contract (C…) address."
          schema: {"type":"string"}
        - name: before
          in: query
          required: false
          description: "Keyset cursor: the last row's id (TOID; ledgers: sequence)."
          schema: {"type":"string","pattern":"^[0-9]+$"}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/Operation"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /accounts/{id}/transfers:
    get:
      tags: [accounts]
      summary: Transfers in and out
      operationId: get_accounts_by_id_transfers
      parameters:
        - name: id
          in: path
          required: true
          description: "Account (G…/M…) or contract (C…) address."
          schema: {"type":"string"}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/Transfer"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /accounts/{id}/trades:
    get:
      tags: [accounts]
      summary: Fills taken by the address
      operationId: get_accounts_by_id_trades
      parameters:
        - name: id
          in: path
          required: true
          description: "Account (G…/M…) or contract (C…) address."
          schema: {"type":"string"}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/Trade"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /accounts/{id}/events:
    get:
      tags: [accounts]
      summary: Protocol events where the address is the user
      operationId: get_accounts_by_id_events
      parameters:
        - name: id
          in: path
          required: true
          description: "Account (G…/M…) or contract (C…) address."
          schema: {"type":"string"}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/ProtocolEvent"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /accounts/{id}/portfolio:
    get:
      tags: [accounts]
      summary: Valued holdings and hourly history
      operationId: get_accounts_by_id_portfolio
      parameters:
        - name: id
          in: path
          required: true
          description: "Account (G…/M…) or contract (C…) address."
          schema: {"type":"string"}
        - name: history
          in: query
          required: false
          description: "Include the hourly value history."
          schema: {"type":"boolean","default":true}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"$ref":"#/components/schemas/Portfolio"}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /accounts/{id}/stats:
    get:
      tags: [accounts]
      summary: Trading and activity indicators
      operationId: get_accounts_by_id_stats
      parameters:
        - name: id
          in: path
          required: true
          description: "Account (G…/M…) or contract (C…) address."
          schema: {"type":"string"}
        - name: hours
          in: query
          required: false
          description: "Window length, ending at the newest indexed ledger."
          schema: {"type":"integer","minimum":1,"maximum":2160,"default":168}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"$ref":"#/components/schemas/AccountStats"}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /accounts/{id}/tags:
    get:
      tags: [accounts]
      summary: Automatic tags and user labels
      operationId: get_accounts_by_id_tags
      parameters:
        - name: id
          in: path
          required: true
          description: "Account (G…/M…) or contract (C…) address."
          schema: {"type":"string"}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {"type":"array","items":{"$ref":"#/components/schemas/Tag"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /assets:
    get:
      tags: [markets]
      summary: Most active assets
      operationId: get_assets
      description: "Cached (CACHE_TTL)."
      parameters:
        - name: hours
          in: query
          required: false
          description: "Window length, ending at the newest indexed ledger."
          schema: {"type":"integer","minimum":1,"maximum":2160,"default":24}
        - {name: limit, in: query, required: false, description: 'Page size.', schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: OK
          content: {application/json: {schema: {type: array, items: {"$ref": "#/components/schemas/AssetActivity"}}}}
        '400':
          description: Invalid parameter
          content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}
        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /assets/{key}:
    get:
      tags: [markets]
      summary: Asset details, 24h totals and top pairs
      operationId: get_assets_by_key
      parameters:
        - name: key
          in: path
          required: true
