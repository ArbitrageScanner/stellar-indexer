        '429': {description: Rate limited, headers: {Retry-After: {schema: {type: integer}}}}
        '500': {description: Internal error, content: {application/json: {schema: {"$ref": "#/components/schemas/Error"}}}}
  /assets/{key}/holders:
    get:
      tags: [markets]
