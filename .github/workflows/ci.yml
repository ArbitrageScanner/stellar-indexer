name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main-branch run midway: it may be publishing or deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          # Release binaries are built with an older Go and refuse go 1.27 modules.
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: indexer
          POSTGRES_PASSWORD: indexer
          POSTGRES_DB: indexer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U indexer" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://indexer:indexer@localhost:5432/indexer?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      # Unit tests, fixture tests on recorded pubnet ledgers, Postgres
      # integration tests and the queue pipeline (in-memory Kafka).
      - run: go test -race -count=1 -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out | tail -1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: indexer
          push: false
          tags: stellar-indexer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway
          push: false
          tags: stellar-gateway:ci
          cache-from: type=gha

  # Full stack (Postgres + Redpanda + fetcher + writer + API) against testnet,
  # then the browser smoke test over every explorer page.
  e2e:
    if: github.event_name != 'pull_request'
    needs: [test, docker]
    runs-on: ubuntu-24.04 # playwright 1.56 has no chromium build for ubuntu 26.04 (ubuntu-latest)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: wait for indexed ledgers
        run: |
          for i in $(seq 1 60); do
            n=$(curl -sf localhost:8080/status | jq -r '.ledgers_indexed // 0')
            [ "${n:-0}" -ge 5 ] && exit 0; sleep 5
          done
          docker compose logs --tail=200; exit 1
      - run: curl -sf localhost:8080/ready
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node web/e2e/smoke.mjs http://localhost:8080
      - if: failure()
        run: docker compose logs --tail=300

  # main only: push the three images tagged with the commit sha, then deploy.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, docker, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: stellar-indexer, context: ., target: indexer }
          - { image: stellar-gateway, context: ., target: gateway }
          - { image: stellar-tunnel, context: deploy/tunnel, target: "" }
    steps:
      - uses: actions/checkout@v4
      - id: reg
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.reg.outputs.prefix }}/${{ matrix.image }}:${{ github.sha }}
            ${{ steps.reg.outputs.prefix }}/${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [publish]
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
