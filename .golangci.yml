version: "2"
run:
  timeout: 5m
linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - revive
  settings:
    gosec:
      excludes:
        - G115   # integer conversions between ledger/XDR widths are range-checked by protocol
        - G202   # SQL is built only from constant fragments and placeholders (see filters)
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
formatters:
  enable: [gofmt, goimports]
