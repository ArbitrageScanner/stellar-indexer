apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ name: pg, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      terminationGracePeriodSeconds: 120
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          args: ["-c", "shared_buffers=6GB", "-c", "effective_cache_size=16GB", "-c", "max_wal_size=8GB",
                 "-c", "work_mem=32MB", "-c", "maintenance_work_mem=1GB", "-c", "max_connections=200"]
          env:
            - { name: POSTGRES_USER, value: indexer }
            - { name: POSTGRES_DB, value: indexer }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: indexer-secrets, key: POSTGRES_PASSWORD } }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "indexer"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "indexer"] }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: "4", memory: 16Gi }
            limits: { cpu: "8", memory: 24Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 600Gi } }
