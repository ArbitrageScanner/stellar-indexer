apiVersion: v1
kind: Service
metadata: { name: redpanda }
spec:
  clusterIP: None
  selector: { app: redpanda }
  ports: [{ name: kafka, port: 9092 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redpanda }
spec:
  serviceName: redpanda
  replicas: 1
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          args: [redpanda, start, --smp=2, --memory=4G, --reserve-memory=0M, --overprovisioned,
                 --kafka-addr=internal://0.0.0.0:9092, --advertise-kafka-addr=internal://redpanda:9092]
          ports: [{ name: kafka, containerPort: 9092 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"] }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: "2", memory: 5Gi }
            limits: { cpu: "3", memory: 6Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/redpanda/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: { requests: { storage: 100Gi } }
