# Applied once by a cluster admin (not by CI). Creates the namespace, guards
# for the shared cluster (quota, default limits, pod security) and the CI
# deployer identity, which can only act inside this namespace.
#
#   kubectl apply -f deploy/k8s/bootstrap/namespace.yaml
#   deploy/k8s/bootstrap/make-kubeconfig.sh > kubeconfig   # → GitHub secret KUBECONFIG_B64
apiVersion: v1
kind: Namespace
metadata:
  name: stellar-indexer
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Cap what this namespace can take, so it can share a cluster with other workloads.
apiVersion: v1
kind: ResourceQuota
metadata: { name: stellar-indexer-quota, namespace: stellar-indexer }
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 48Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    requests.storage: 800Gi
    persistentvolumeclaims: "10"
    pods: "40"
    services.nodeports: "0"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata: { name: stellar-indexer-defaults, namespace: stellar-indexer }
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ci-deployer, namespace: stellar-indexer }
---
# Built-in "edit": workloads, services, config, secrets, PVCs, jobs, network
# policies in this namespace only. It cannot touch RBAC, quotas or the
# namespace itself, and nothing cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ci-deployer-edit, namespace: stellar-indexer }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit }
subjects:
  - { kind: ServiceAccount, name: ci-deployer, namespace: stellar-indexer }
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: stellar-indexer
  annotations: { kubernetes.io/service-account.name: ci-deployer }
type: kubernetes.io/service-account-token
