# Only pods of this namespace may connect to its pods. Egress stays open:
# Stellar RPC, SEP-1 logo fetches and the tunnel to the edge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: same-namespace-only }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
