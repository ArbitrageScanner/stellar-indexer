# Override for an indexer that reaches the edge over an SSH reverse tunnel
# (the k3s deployment: deploy/k8s/tunnel.yaml). The indexer's tunnel pod dials
# tunnel:2222 and remote-forwards the internal API to tunnel:18080, which is
# reachable only on this compose network; the gateway talks mTLS to it.
#
#   docker compose -f docker-compose.yml -f compose.tunnel.yml up -d
services:
  tunnel:
    image: ${TUNNEL_IMAGE:-stellar-tunnel:latest}
    build: { context: ../tunnel }
    command: [server]
    ports: ["2222:2222"]          # key-only, one user, remote forwards to :18080 only
    volumes: ["./tunnel:/etc/tunnel:ro"]   # ssh_host_ed25519_key, authorized_keys
    read_only: true
    tmpfs: [/etc/ssh, /run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, SYS_CHROOT, DAC_OVERRIDE, FOWNER, NET_BIND_SERVICE, AUDIT_WRITE]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  gateway:
    depends_on: [tunnel]
    environment:
      UPSTREAM_URL: https://tunnel:18080
      UPSTREAM_SERVER_NAME: indexer-api
      UPSTREAM_CA_FILE: /certs/ca.crt
      UPSTREAM_CERT_FILE: /certs/gateway.crt
      UPSTREAM_KEY_FILE: /certs/gateway.key
